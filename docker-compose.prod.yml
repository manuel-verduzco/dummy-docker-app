# Production (Azure VM): pulls the prebuilt image from ghcr.io.
#   IMAGE_TAG=latest docker compose -f docker-compose.prod.yml up -d
# IMAGE_TAG defaults to "latest"; set it to a commit SHA to pin or roll back.
services:
  web:
    image: ghcr.io/manuel-verduzco/dummy-docker-app:${IMAGE_TAG:-latest}
    ports:
      - "80:3000"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
